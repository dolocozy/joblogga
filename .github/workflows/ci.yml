name: CI

on:
  push:
  pull_request:

# Cancel an in-progress run when a newer push to the same branch arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # No SECRET_KEY needed here: tests/conftest.py sets a throwaway one.
      - run: pytest

  # The same suite again on real Postgres, the database production uses. SQLite and
  # Postgres differ in dates, enums, timezones and locking, so passing on one does
  # not prove the other.
  backend-postgres:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: joblogga_test
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the tests start.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/joblogga_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` installs exactly what package-lock.json says (reproducible).
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `npm run build` runs `tsc -b` (typecheck) and then the Vite build.
      - run: npm run build

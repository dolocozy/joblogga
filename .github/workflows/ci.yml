name: CI

on:
  push:
  pull_request:

# Cancel an in-progress run when a newer push to the same branch arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # No SECRET_KEY needed here: tests/conftest.py sets a throwaway one.
      - run: pytest

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` installs exactly what package-lock.json says (reproducible).
      - run: npm ci
      - run: npm run lint
      # `npm run build` runs `tsc -b` (typecheck) and then the Vite build.
      - run: npm run build

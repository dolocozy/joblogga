# Render Blueprint: describes the backend so it can be created in one step
# (Render dashboard > New > Blueprint). The database is NOT created here: it lives
# on Neon, because Render's free Postgres expires after 30 days.
services:
  - type: web
    name: joblogga-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass  # deploy only when the GitHub CI checks pass
    envVars:
      # Same major version as local development and CI.
      - key: PYTHON_VERSION
        value: 3.14.3
      # Random, created once by Render and never shown in the repo. It signs login
      # tokens: keep it stable, because changing it logs every user out.
      - key: SECRET_KEY
        generateValue: true
      # Rate limits are per client address, so the API must know each visitor's real
      # address. On Render, requests pass Cloudflare and then Render's own load
      # balancer, and the connection address the server sees can be FORGED via
      # X-Forwarded-For (measured), so it is never used. Instead:
      #  1. cf-connecting-ip: set by Cloudflare, which rejects or overwrites a
      #     client-supplied one. Preferred.
      #  2. Fallback: X-Forwarded-For counted 3 entries from the right (client,
      #     Cloudflare edge, Render internal). The left side is client-written.
      # Check against the "rate limited" lines in the service logs.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      # Password reset emails (Resend). The link in the email points here, so it must be
      # the real address of the frontend: with the default (localhost) every reset email
      # would carry a link that only works on the developer's own machine.
      - key: FRONTEND_URL
        value: https://joblogga.vercel.app
      - key: EMAIL_FROM
        value: Joblogga <noreply@dolocozy.com>
      # Secrets you paste in the dashboard; deliberately not stored in this file.
      - key: DATABASE_URL
        sync: false
      # The frontend's address, e.g. https://joblogga.vercel.app (no trailing slash).
      - key: CORS_ORIGINS
        sync: false
      # Resend API key (starts "re_"). Without it the API still runs, but reset emails are
      # not sent. Blueprint prompts for these only when first created, so for an existing
      # service add it under Environment in the dashboard.
      - key: RESEND_API_KEY
        sync: false
